name: Hotfix guard
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
permissions:
  contents: read
  statuses: write
  pull-requests: read
concurrency:
  group: hotfix-guard
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide target and check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          post() { gh api "repos/$REPO/statuses/$1" -f context=hotfix-on-staging -f state="$2" -f description="$3" -f target_url="$RUN_URL" >/dev/null; echo "status $2 on $1: $3"; }
          if [ "$EVENT" = "pull_request" ] && [ "$HEAD_REF" != "staging" ]; then
            post "$HEAD_SHA" success "not a promotion PR"; exit 0
          fi
          if [ "$EVENT" = "push" ]; then
            TARGET=$(gh pr list --repo "$REPO" --base main --head staging --state open --json headRefOid --jq '.[0].headRefOid // empty')
            [ -z "$TARGET" ] && { echo "no open promotion PR"; exit 0; }
          else
            TARGET="$HEAD_SHA"
          fi
          git fetch -q origin main staging
          MISSING=$(git log --no-merges --format='%h %s' origin/staging..origin/main | grep -v ' chore(release): ' || true)
          if [ -z "$MISSING" ]; then
            post "$TARGET" success "staging has every hotfix on main"
          else
            N=$(printf '%s\n' "$MISSING" | wc -l | tr -d ' ')
            { echo "## hotfix not on staging yet"; echo '```'; echo "$MISSING"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            post "$TARGET" failure "$N hotfix commit(s) on main not on staging"
          fi
